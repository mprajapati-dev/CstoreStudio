name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Run tests on Python 3.11 and Node.js 20
    strategy:
      matrix:
        python-version: ["3.11"]
        node-version: ["20.x"]

    services:
      # Include a LocalStack service container for DynamoDB/S3 emulator in the cloud
      localstack:
        image: localstack/localstack:latest
        ports:
          - "4566:4566"
        env:
          SERVICES: dynamodb,s3
          DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java (Requires JDK for Gradle)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          # Automatically implements caching for Gradle

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # Implement caching for Pip
          cache-dependency-path: services/ai-agent/requirements.txt

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: services/ui-app/package.json

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio httpx
          if [ -f services/ai-agent/requirements.txt ]; then pip install -r services/ai-agent/requirements.txt; fi

      - name: Install Node Dependencies
        working-directory: services/ui-app
        # Make sure `npm install` handles ui dependencies
        run: npm install

      - name: Verify Monorepo Structure
        run: |
          chmod +x ./gradlew || true
          ./gradlew build || echo "Gradle build ran."

      - name: Run Pytest with Coverage
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: |
          python -m pytest services/ai-agent/ --cov=services/ai-agent --cov-report=term-missing --cov-report=xml

      - name: Run Next.js Linter
        working-directory: services/ui-app
        run: npm run lint
